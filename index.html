    <!--
      Baseline content security policy: https-only resources, no plugins, no base-tag hijacking, no
      framing of other sites, forms post to this origin only. Script and image hosts are not narrowed
      here because the hosting platform injects its own runtime assets; docs/upgrade/SECURITY.md has
      the stricter policy to enable as a response header once those hosts are confirmed on a preview.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; img-src 'self' data: blob: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https:; connect-src 'self' https: wss:; frame-src 'none'; worker-src 'self' blob:"
    />
